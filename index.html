<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quvo Browser</title><style>
:root{font-family:system-ui,sans-serif;color:#183153;background:#f2f8ff}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #d6e7f9;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:20px;color:#1674da;margin:0}input,select,button{border:1px solid #bdd8f3;border-radius:10px;padding:10px;font:inherit}input{min-width:180px;flex:1}button{background:#1879e5;color:#fff;cursor:pointer;border:0}main{max-width:1100px;margin:18px auto;padding:0 14px}iframe{width:100%;height:72vh;border:1px solid #d6e7f9;border-radius:12px;background:white}footer{text-align:center;color:#6c8199;padding:12px}.hint{font-size:13px;color:#567}#login{max-width:460px;margin:24px auto;padding:20px;background:#fff;border-radius:14px}#login input{width:100%;margin:8px 0}
</style></head><body>
<header><h1>Quvo Browser</h1><select id="sites" aria-label="サイト選択"></select><input id="path" value="/" aria-label="ページパス" placeholder="/ または /path"><button id="go">表示</button><button id="back">戻る</button><button id="reload">更新</button></header>
<section id="login"><h2>自分専用ログイン</h2><form action="/login" method="post"><input type="password" name="token" placeholder="ACCESS_TOKEN" required><button>ログイン</button></form></section>
<main><p class="hint">登録した自分のサイトだけ表示できます。外部サイトの一部機能は動作しない場合があります。</p><iframe id="viewer" title="サイト表示" referrerpolicy="no-referrer"></iframe></main>
<footer>©QuvoCorporation</footer>
<script>
const sites=document.getElementById('sites'), path=document.getElementById('path'), frame=document.getElementById('viewer');
let history=[];
fetch('/api/sites').then(r=>r.json()).then(items=>{
  for(const s of items){const opt=document.createElement('option');opt.value=s.id;opt.textContent=s.origin;sites.append(opt)}
}).catch(()=>alert('サイト一覧の取得に失敗しました'));
function navigate(){const p=path.value.trim();if(!p.startsWith('/')||p.startsWith('//'))return alert('パスは / から始めてください');const id=sites.value;if(!id)return;const url=`/site/${id}${p}`;history.push(url);frame.src=url;}
document.getElementById('go').onclick=navigate;
document.getElementById('reload').onclick=()=>{if(frame.src)frame.src=frame.src};
document.getElementById('back').onclick=()=>{if(history.length>1){history.pop();frame.src=history[history.length-1]}};
frame.addEventListener('load',()=>{try{if(frame.contentDocument?.body?.textContent?.trim()==='Login required')document.getElementById('login').style.display='block'}catch(e){}});
</script></body></html>
